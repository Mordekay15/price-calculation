# Builds LibreDWG's dwg2dxf for Linux and commits it as bin/dwg2dxf, so the
# DXF tab can read DWG files where ODA File Converter can't be installed
# (Streamlit Community Cloud). Runs when this file changes, or by hand.
name: Build dwg2dxf

on:
  push:
    paths:
      - .github/workflows/build-dwg2dxf.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  LIBREDWG_VERSION: "0.13.3"

jobs:
  build:
    # An older Ubuntu, so the binary also runs on older Linux (glibc).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build dwg2dxf (static libredwg)
        run: |
          curl -fsSL "https://ftp.gnu.org/gnu/libredwg/libredwg-${LIBREDWG_VERSION}.tar.xz" -o libredwg.tar.xz
          tar xf libredwg.tar.xz
          cd "libredwg-${LIBREDWG_VERSION}"
          ./configure --disable-shared --enable-static --disable-bindings --disable-werror
          make -j"$(nproc)" -C src
          make -j"$(nproc)" -C programs dwg2dxf dxf2dwg
          strip programs/dwg2dxf programs/dxf2dwg
          mkdir -p "$GITHUB_WORKSPACE/bin"
          cp programs/dwg2dxf "$GITHUB_WORKSPACE/bin/dwg2dxf"
          cp programs/dxf2dwg /tmp/dxf2dwg
          "$GITHUB_WORKSPACE/bin/dwg2dxf" --version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read sample DWGs with the app's reader
        run: |
          pip install -q -r requirements.txt
          cp -r "libredwg-${LIBREDWG_VERSION}/test/test-data" /tmp/test-data || true
          python - <<'EOF'
          import glob, subprocess, ezdxf
          # A plate drawn by ezdxf, turned into DWG by LibreDWG's (experimental) dxf2dwg.
          doc = ezdxf.new("R2000"); doc.header["$INSUNITS"] = 4
          msp = doc.modelspace()
          msp.add_lwpolyline([(0, 0), (300, 0), (300, 200), (0, 200)], close=True)
          msp.add_circle((150, 100), 20)
          doc.saveas("/tmp/plate.dxf")
          subprocess.run(["/tmp/dxf2dwg", "-y", "-o", "/tmp/plate.dwg", "/tmp/plate.dxf"],
                         capture_output=True)

          from core import dwg
          dwg._oda_installed = lambda: False
          import os
          os.environ["LIBREDWG_BIN"] = "bin/dwg2dxf"
          files = ["/tmp/plate.dwg"] + sorted(glob.glob("/tmp/test-data/*.dwg"))[:12]
          ok = 0
          for path in files:
              f = dwg.read_drawing(open(path, "rb").read(), os.path.basename(path))
              n = len(f.pieces)
              ok += n > 0 and not f.problems
              print(f"{os.path.basename(path):40s} pieces={n:5d} problems={f.problems[:1]}")
          print(f"read {ok} of {len(files)}")
          assert ok, "no sample DWG could be read"
          EOF

      - name: Commit bin/dwg2dxf
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/dwg2dxf
          if git diff --cached --quiet; then
            echo "bin/dwg2dxf is unchanged"
          else
            git commit -m "bin/dwg2dxf: LibreDWG ${LIBREDWG_VERSION}, built by GitHub Actions"
            git push
          fi
