# Builds LibreDWG's dwg2dxf for Linux (bin/dwg2dxf) and fetches the official
# Windows build (bin/libredwg-win64/), tests both with the app's reader, and
# commits them, so the DXF tab can read DWG files without ODA File Converter.
# Runs when this file changes, or by hand.
name: Build dwg2dxf

on:
  push:
    paths:
      - .github/workflows/build-dwg2dxf.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  LIBREDWG_VERSION: "0.13.3"

jobs:
  build:
    # An older Ubuntu, so the binary also runs on older Linux (glibc).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build dwg2dxf (static libredwg)
        run: |
          curl -fsSL "https://ftp.gnu.org/gnu/libredwg/libredwg-${LIBREDWG_VERSION}.tar.xz" -o libredwg.tar.xz
          tar xf libredwg.tar.xz
          cd "libredwg-${LIBREDWG_VERSION}"
          ./configure --disable-shared --enable-static --disable-bindings --disable-werror
          make -j"$(nproc)" -C src
          make -j"$(nproc)" -C programs dwg2dxf dxf2dwg
          strip programs/dwg2dxf programs/dxf2dwg
          mkdir -p "$GITHUB_WORKSPACE/bin"
          cp programs/dwg2dxf "$GITHUB_WORKSPACE/bin/dwg2dxf"
          cp programs/dxf2dwg /tmp/dxf2dwg
          "$GITHUB_WORKSPACE/bin/dwg2dxf" --version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read sample DWGs with the app's reader
        run: |
          pip install -q -r requirements.txt
          cp -r "libredwg-${LIBREDWG_VERSION}/test/test-data" /tmp/test-data || true
          python - <<'EOF'
          import glob, subprocess, ezdxf
          # A plate drawn by ezdxf, turned into DWG by LibreDWG's (experimental) dxf2dwg.
          doc = ezdxf.new("R2000"); doc.header["$INSUNITS"] = 4
          msp = doc.modelspace()
          msp.add_lwpolyline([(0, 0), (300, 0), (300, 200), (0, 200)], close=True)
          msp.add_circle((150, 100), 20)
          doc.saveas("/tmp/plate.dxf")
          subprocess.run(["/tmp/dxf2dwg", "-y", "-o", "/tmp/plate.dwg", "/tmp/plate.dxf"],
                         capture_output=True)

          from core import dwg
          dwg._oda_installed = lambda: False
          import os
          os.environ["LIBREDWG_BIN"] = "bin/dwg2dxf"
          files = ["/tmp/plate.dwg"] + sorted(glob.glob("/tmp/test-data/*.dwg"))[:12]
          ok = 0
          for path in files:
              f = dwg.read_drawing(open(path, "rb").read(), os.path.basename(path))
              n = len(f.pieces)
              ok += n > 0 and not f.problems
              print(f"{os.path.basename(path):40s} pieces={n:5d} problems={f.problems[:1]}")
          print(f"read {ok} of {len(files)}")
          assert ok, "no sample DWG could be read"
          EOF

      - name: Commit bin/dwg2dxf
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/dwg2dxf
          if git diff --cached --quiet; then
            echo "bin/dwg2dxf is unchanged"
          else
            git commit -m "bin/dwg2dxf: LibreDWG ${LIBREDWG_VERSION}, built by GitHub Actions"
            git push
          fi

  windows:
    # After the Linux job, so the two commits don't race.
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Fetch the official Windows build
        run: |
          git pull --ff-only origin "${GITHUB_REF_NAME}"
          url="https://ftp.gnu.org/gnu/libredwg/libredwg-${LIBREDWG_VERSION}-win64.zip"
          curl -fsSL "$url" -o libredwg.zip || curl -fsSL \
            "https://github.com/LibreDWG/libredwg/releases/download/${LIBREDWG_VERSION}/libredwg-${LIBREDWG_VERSION}-win64.zip" \
            -o libredwg.zip
          mkdir -p win && unzip -q libredwg.zip -d win
          exe=$(find win -iname dwg2dxf.exe | head -1)
          echo "found: $exe"
          rm -rf bin/libredwg-win64 && mkdir -p bin/libredwg-win64
          dir=$(dirname "$exe")
          cp "$exe" bin/libredwg-win64/
          cp "$dir"/*.dll bin/libredwg-win64/ 2>/dev/null || true
          ls -la bin/libredwg-win64
          bin/libredwg-win64/dwg2dxf.exe --version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read a sample DWG with the app's reader
        run: |
          pip install -q -r requirements.txt
          curl -fsSL "https://ftp.gnu.org/gnu/libredwg/libredwg-${LIBREDWG_VERSION}.tar.xz" -o src.tar.xz
          tar xf src.tar.xz "libredwg-${LIBREDWG_VERSION}/test/test-data/example_2018.dwg" \
            "libredwg-${LIBREDWG_VERSION}/test/test-data/sample_2000.dwg"
          python - <<'EOF'
          import glob, os
          from core import dwg
          dwg._oda_installed = lambda: False
          print("converter:", dwg.converter(), dwg.libredwg_executable())
          assert dwg.libredwg_executable().endswith("dwg2dxf.exe")
          ok = 0
          for path in glob.glob("libredwg-*/test/test-data/*.dwg"):
              f = dwg.read_drawing(open(path, "rb").read(), os.path.basename(path))
              print(os.path.basename(path), len(f.pieces), f.problems[:1])
              ok += bool(f.pieces) and not f.problems
          assert ok, "no sample DWG could be read"
          EOF

      - name: Commit bin/libredwg-win64
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/libredwg-win64
          if git diff --cached --quiet; then
            echo "bin/libredwg-win64 is unchanged"
          else
            git commit -m "bin/libredwg-win64: LibreDWG ${LIBREDWG_VERSION} for Windows"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
