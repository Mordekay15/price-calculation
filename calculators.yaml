# The shop's work-phase calculators (see core/calculators.py).
# Edit in the app (sidebar: Laskurit); the edited copy is saved as
# calculators.local.yaml and used instead of this file.

calculators:
  - id: sarmays
    name: Särmäys (automaattinen)
    note: >
      Taivutusten määrä ja osan paino luetaan osalta. Aika taivutusta kohden ja
      tuntihinta painoluokan mukaan (1 hlö alle 20 kg, 2 hlöä 20–40 kg, nosturi yli 40 kg).
    replaces: bending
    inputs:
      weight_kg: {label: Paino (kg), auto: weight_kg}
      bends:     {label: Taivutukset (kpl), auto: bends}
    tables:
      sec_per_bend:              # painoluokka (kg, vähintään) -> s / taivutus
        by: weight_kg
        rows: [[0, 10], [1, 15], [3, 25], [5, 50], [10, 80]]
      hourly_rate:               # painoluokka (kg, yli) -> €/h
        by: weight_kg
        rows: [[0, 60], [20, 120], [40, 180]]
    setup_min: "10 + 2 * bends"            # perusasetus + 2 min / taivutus
    run_min: "bends * sec_per_bend / 60"
    eur_per_h: hourly_rate

  - id: maalaus
    name: Maalaus (esimerkki)
    note: Esimerkkiarvot, muuta omiksi. Kaksi puolta maalataan.
    inputs:
      area_m2:     {label: Pinta-ala (m²), auto: area_m2}
      min_per_m2:  {label: Maalausaika (min/m²), default: 4}
    setup_min: 15
    run_min: "2 * area_m2 * min_per_m2"
    eur_per_h: 55

chains:
  Laser-Särmäys: [sarmays]
  Laser-Särmäys-Maalaus: [sarmays, maalaus]
  Laser-Maalaus: [maalaus]
