# Run the app in Docker: `docker compose up -d --build` (see README, "Run with Docker").
services:
  app:
    build: .
    image: stremet-price
    container_name: stremet-price
    ports:
      - "8501:8501"
    volumes:
      # The saved price lists (price_data_*.json) live here, outside the container.
      - ./data:/data
    environment:
      # Sparrow runs at once (see README, "Sparrow executable"): 3 on the
      # server's 4 dedicated cores. Remove the line to pick from the cores.
      - SPARROW_PARALLEL=3
    restart: unless-stopped
